services:
  api:
    build: .
    image: cve-registration-api:latest
    container_name: cve-registration-api
    restart: unless-stopped
    ports:
      # Host e container usam o mesmo PORT (Dokploy Environment ou .env local)
      - "${PORT:-8080}:${PORT:-8080}"
    # .env local é opcional; no Dokploy as vars vêm da aba Environment
    env_file:
      - path: .env
        required: false
